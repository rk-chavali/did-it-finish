name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: dist/ is up to date
        run: |
          npm run build
          git diff --exit-code --stat dist/ || {
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          }

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: finish
        uses: ./
        with:
          test-command: npm test
          fail-on: none
      - run: echo "Verdict was ${{ steps.finish.outputs.verdict }} with ${{ steps.finish.outputs.finding-count }} finding(s)"
